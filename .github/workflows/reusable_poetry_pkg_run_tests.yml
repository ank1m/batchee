name: Reusable Pytest Workflow

on:
  workflow_call:
    inputs:
      package-name:
        description: 'The name of the Python package/directory to format and test'
        required: true
        type: string
      python-version:
        description: 'Python version to use for testing'
        required: true
        type: string
      install-extras-names:
        description: 'Extras to install'
        required: false
        type: string
      test-path:
        description: 'Path to the directory containing tests'
        required: false
        type: string
        default: '.'
      coverage-output-path:
        description: 'Path to output the coverage report'
        required: false
        type: string
        default: 'coverage.xml'
      coverage-flags:
        description: 'Flags to apply to coverage'
        required: false
        type: string
    secrets:
      codecov_token:
        description: 'Codecov token for generating test coverage report'
        required: true

env:
  POETRY_VERSION: "2.1.3"

jobs:
  run-pytest-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v4.0.0
        with:
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Install package
        run: poetry install --extras "${{ inputs.install-extras-names }}"
        
      - name: Lint
        run: |
          poetry run ruff check ${{ inputs.package-name }}

      - name: Run Pytest tests and generate coverage report
        run: |
          poetry run pytest ${{ inputs.test-path }} --cov=${{ inputs.package-name }} --cov-report=xml:${{ inputs.coverage-output-path }}

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ inputs.coverage-flags }}
